name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v${v}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${v}" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package site
        run: |
          cd dist
          zip -r "../wingdesigner-${GITHUB_REF_NAME}-site.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          use="Use: unzip wingdesigner-${GITHUB_REF_NAME}-site.zip and open index.html in the browser; it runs from the file without a web server (tested in Chromium). A static web server on the folder works as well, e.g. python3 -m http.server. LICENSES.txt holds the licenses of the app and of its bundled libraries."
          body="$(printf '%s\n\n%s\n' "${notes:-See CHANGELOG.md.}" "${use}")"
          gh release create "${GITHUB_REF_NAME}" "wingdesigner-${GITHUB_REF_NAME}-site.zip" \
            --title "Wingdesigner ${GITHUB_REF_NAME}" \
            --notes "${body}"
