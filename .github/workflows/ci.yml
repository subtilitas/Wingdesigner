name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue so a running Pages deployment is never cancelled; other refs cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint, unit tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: README coverage table matches
        run: npm run coverage:check
      - name: Bundled airfoil library
        run: npm run airfoils:check
      - name: Documentation pages, links and images
        run: npm run docs:check
      - name: Test counts in the documentation
        run: npm run counts:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  step:
    name: STEP and 3MF validation (OpenCascade, lib3mf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-ocp-${{ runner.os }}-8.0.1-lib3mf-2.5.0
      - run: npm ci
      - run: pip install cadquery-ocp==8.0.1.0.0 lib3mf==2.5.0
      - run: npm run step:cases
      - run: python scripts/validate_step.py step-check/cases.json
      - run: python scripts/validate_3mf.py step-check/cases.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: step-files
          path: step-check/
          retention-days: 14

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # npm run e2e builds dist/ first and serves that build.
      - run: npm run e2e
      # test.skip decides at run time which tests run on one device only: counted from this run.
      - name: Device-only test counts in the documentation
        run: npm run counts:check -- --e2e-report playwright-report/results.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site configuration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, step, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
